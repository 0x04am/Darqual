[package]
name = "darqual-core"
version = "0.0.1"
edition = "2021"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
blake3 = "1"
rand = "0.8"
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
dirs = "5"
bincode = "1"

[dev-dependencies]
tempfile = "3"
proptest = "1"
