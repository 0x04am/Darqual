[package]
name = "darqual-node"
version = "0.9.0"
edition = "2021"

[[bin]]
name = "darqual-node"
path = "src/main.rs"

[dependencies]
darqual-core   = { path = "../darqual-core" }
darqual-ledger = { path = "../darqual-ledger" }
darqual-cover  = { path = "../darqual-cover" }
darqual-net    = { path = "../darqual-net" }
tokio     = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "signal"] }
clap      = { version = "4", features = ["derive"] }
anyhow    = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand      = "0.8"
tracing   = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
