[package]
name = "darqual-net"
version = "0.9.0"
edition = "2021"

[dependencies]
darqual-core   = { path = "../darqual-core" }
darqual-ledger = { path = "../darqual-ledger" }
tokio      = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
thiserror  = "1"
tracing    = "0.1"
serde_json = "1"

[dev-dependencies]
darqual-core   = { path = "../darqual-core" }
darqual-ledger = { path = "../darqual-ledger" }
darqual-cover  = { path = "../darqual-cover" }
tokio      = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
rand       = "0.8"
rand_chacha = "0.3"
x25519-dalek = { version = "2", features = ["static_secrets"] }
