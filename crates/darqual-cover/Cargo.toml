[package]
name = "darqual-cover"
version = "0.8.0"
edition = "2021"
description = "Stage 8 — cover traffic + differential-privacy noise (Vuvuzela-style metadata hardening)"
license = "MIT"

[dependencies]
darqual-core   = { path = "../darqual-core" }
darqual-ledger = { path = "../darqual-ledger" }
blake3         = "1"
rand           = "0.8"
thiserror      = "1"
x25519-dalek   = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
rand        = { version = "0.8", features = ["std_rng"] }
rand_chacha = "0.3"
x25519-dalek = { version = "2", features = ["static_secrets"] }
