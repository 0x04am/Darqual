[workspace]
members = [
    "crates/darqual-core",
    "crates/darqual-cli",
    "crates/darqual-net",
    "crates/darqual-node",
    "crates/darqual-ledger",
    "crates/darqual-storage",
    "crates/darqual-committee",
    "crates/darqual-cover",
    "crates/darqual-sim",
]
resolver = "2"
# darqual-tor (Arti/Tor) is EXCLUDED from the gated workspace — its ~350-crate
# dependency tree would make verify.sh take >5min. It builds standalone.
exclude = ["crates/darqual-tor"]
